packages:
  - apps/*
  - packages/*

# 核心：所有依赖均为项目必需，全部允许执行构建脚本
allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  '@swc/core': true
  argon2: true
  esbuild: true
  ip2region-ts: true
  msgpackr-extract: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@swc/core-linux-x64-musl@1.15.41'
  - '@swc/core-win32-arm64-msvc@1.15.41'
  - '@swc/core-win32-ia32-msvc@1.15.41'
  - '@swc/core-win32-x64-msvc@1.15.41'
  - nodemailer@8.0.11
